name: Refresh IZI Dex data bundle

on:
  push:
    branches: ["master"]
    paths:
      - "data/v2/csv/pokemon.csv"
      - "data/v2/csv/pokemon_species.csv"
      - "data/v2/csv/pokemon_species_names.csv"
      - "data/v2/csv/pokemon_types.csv"
      - "data/v2/csv/pokemon_stats.csv"
      - "data/v2/csv/pokemon_forms.csv"
      - "data/v2/csv/pokemon_form_names.csv"
      - "data/v2/csv/types.csv"
      - "data/v2/csv/stats.csv"
      - "data/v2/csv/version_groups.csv"
      - "data/v2/csv/encounters.csv"
      - "data/v2/csv/encounter_slots.csv"
      - "data/v2/csv/encounter_methods.csv"
      - "data/v2/csv/encounter_method_prose.csv"
      - "data/v2/csv/location_areas.csv"
      - "data/v2/csv/location_area_encounter_rates.csv"
      - "data/v2/csv/locations.csv"
      - "data/v2/csv/location_names.csv"
      - "data/v2/csv/versions.csv"
      - "scripts/export_izi_dex_data.py"
      - "scripts/export_izi_dex_encounters.py"
      - ".github/workflows/izi-dex-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: izi-dex-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use upstream PokeAPI CSVs for scheduled updates
        if: github.event_name == 'schedule'
        run: |
          git clone --depth 1 https://github.com/PokeAPI/pokeapi.git "$RUNNER_TEMP/pokeapi-upstream"
          echo "POKEAPI_SOURCE_DIR=$RUNNER_TEMP/pokeapi-upstream/data/v2/csv" >> "$GITHUB_ENV"
          echo "POKEAPI_SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/pokeapi-upstream" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "POKEAPI_SOURCE_BRANCH=master" >> "$GITHUB_ENV"
          echo "POKEAPI_SOURCE_REPOSITORY=PokeAPI/pokeapi" >> "$GITHUB_ENV"

      - name: Use this fork's CSVs for push and manual updates
        if: github.event_name != 'schedule'
        run: |
          echo "POKEAPI_SOURCE_DIR=data/v2/csv" >> "$GITHUB_ENV"
          echo "POKEAPI_SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "POKEAPI_SOURCE_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "POKEAPI_SOURCE_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - name: Generate IZI Dex bundle
        run: |
          python scripts/export_izi_dex_data.py \
            --pokeapi-dir "$POKEAPI_SOURCE_DIR" \
            --max-species 809 \
            --max-generation 7 \
            --output-dir izi-dex/v1 \
            --source-commit "$POKEAPI_SOURCE_COMMIT" \
            --source-branch "$POKEAPI_SOURCE_BRANCH" \
            --source-repository "$POKEAPI_SOURCE_REPOSITORY"
          python scripts/export_izi_dex_encounters.py \
            --pokeapi-dir "$POKEAPI_SOURCE_DIR" \
            --max-species 809 \
            --max-generation 7 \
            --output-dir izi-dex/v1

      - name: Commit bundle when changed
        run: |
          git add izi-dex/v1/
          if git diff --cached --quiet; then
            echo "IZI Dex bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh IZI Dex data bundle"
          git push
